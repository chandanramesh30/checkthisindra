<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Be My Valentine 💖</title>
<style>
    body {
        margin: 0;
        height: 100vh;
        background: linear-gradient(135deg, #ff758c, #ff7eb3);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Segoe UI', sans-serif;
        overflow: hidden;
    }

    .card {
        background: white;
        padding: 50px;
        border-radius: 20px;
        text-align: center;
        box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    }

    h1 {
        color: #ff4081;
        font-size: 36px;
        margin-bottom: 30px;
    }

    button {
        font-size: 20px;
        padding: 12px 30px;
        border: none;
        border-radius: 30px;
        cursor: pointer;
        transition: 0.3s;
    }

    #yes {
        background: #ff4081;
        color: white;
        margin-right: 20px;
    }

    #yes:hover {
        transform: scale(1.1);
    }

    #no {
        background: #ddd;
        color: #333;
        position: absolute;
    }

    .hearts {
        position: fixed;
        bottom: -10px;
        font-size: 24px;
        animation: floatUp 4s linear infinite;
    }

    @keyframes floatUp {
        from {
            transform: translateY(0);
            opacity: 1;
        }
        to {
            transform: translateY(-100vh);
            opacity: 0;
        }
    }
</style>
</head>

<body>

<div class="card">
    <h1>Will you be my Valentine? 💕</h1>
    <button id="yes" onclick="sayYes()">Yes 😍</button>
    <button id="no" onmouseover="moveNo()">No 😜</button>
</div>

<script>
function sayYes() {
    document.body.innerHTML = `
        <div style="
            display:flex;
            align-items:center;
            justify-content:center;
            height:100vh;
            flex-direction:column;
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            color:white;
            font-family: Segoe UI;">
            <h1 style="font-size:50px;">Yaaay! 💖🥰</h1>
            <h2>You just made me the happiest person 😘</h2>
        </div>
    `;
}

function moveNo() {
    const no = document.getElementById("no");
    const x = Math.random() * (window.innerWidth - no.offsetWidth);
    const y = Math.random() * (window.innerHeight - no.offsetHeight);
    no.style.left = x + "px";
    no.style.top = y + "px";
}
</script>

</body>
</html>
