<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Be My Valentine 💖</title>

<style>
body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(135deg, #ff758c, #ff7eb3);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', sans-serif;
    overflow: hidden;
}

.card {
    background: white;
    padding: 50px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    width: 350px;
}

h1 {
    color: #ff4081;
    font-size: 32px;
    margin-bottom: 20px;
}

.gif {
    width: 220px;
    margin-bottom: 20px;
}

.buttons {
    position: relative;
    width: 300px;
    height: 80px;
    margin: auto;
}

button {
    font-size: 20px;
    padding: 12px 28px;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    transition: 0.3s;
}

#yes {
    background: #ff4081;
    color: white;
    position: absolute;
    left: 20px;
}

#yes:hover {
    transform: scale(1.1);
}

#no {
    background: #ddd;
    color: #333;
    position: absolute;
    left: 160px;
}
</style>
</head>

<body>

<!-- Background Music -->
<audio autoplay loop>
  <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
</audio>

<div class="card">
    <img class="gif" src="https://media.giphy.com/media/l4FGpP4lxGGgK5CBW/giphy.gif">
    <h1>Will you be my Valentine? 💕</h1>

    <div class="buttons">
        <button id="yes" onclick="sayYes()">Yes 😍</button>
        <button id="no" onmouseover="moveNo()">No 😜</button>
    </div>
</div>

<script>
function sayYes() {
    document.body.innerHTML = `
    <div style="
        display:flex;
        align-items:center;
        justify-content:center;
        height:100vh;
        flex-direction:column;
        background: linear-gradient(135deg, #ff758c, #ff7eb3);
        color:white;
        font-family: Segoe UI;
        text-align:center;">
        
        <img src="https://media.giphy.com/media/3oriO0OEd9QIDdllqo/giphy.gif" style="width:300px;">
        <h1 style="font-size:50px;">Yaaay! 💖🥰</h1>
        <h2>You just made me the happiest person 😘</h2>
    </div>`;
}

function moveNo() {
    const no = document.getElementById("no");
    const box = document.querySelector(".buttons");

    const x = Math.random() * (box.offsetWidth - no.offsetWidth);
    const y = Math.random() * (box.offsetHeight - no.offsetHeight);

    no.style.left = x + "px";
    no.style.top = y + "px";
}
</script>

</body>
</html>
